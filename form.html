    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">

    <script src="../js/form.js" defer></script>
</head>

<body>
    <header>
        <div class="banner">
            <h1>
                <img class="doctor" src="imagens/Joystick_tali_semFundo.png" alt="Logo Joystick">
                <p class="texto__logo">We live together. We play together</p>
            </h1>
            <nav>
                <ul class="navegacao">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="link_membros/membros.html">Membros</a></li>
                    <li><a href="link_about/about.html">Sobre</a></li>
                    <li><a href="form.html">Formulário</a></li>
                </ul>
            </nav>
        </div>

        <div class="categorias">
            <ul class="categorias__lista">
                <li><a href="#">Notícias</a></li>
                <li><a href="#">Análises</a></li>
                <li><a href="#">Previews</a></li>

                <li><a href="#">Rumores</a></li>
                <li><a href="#">Trailers</a></li>
            </ul>
        </div>
    </header>


    <main>
        <h2>Formulário de Contato</h2>
        <form action="formAction.html" method="get" onsubmit="return validarFormulario();">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="1" required><br><br>

            <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" required></textarea><br><br>

            <input type="submit" value="Enviar">
        </form>
    </main>

    <footer>
        <img class="blackheart" src="imagens/Joystick_tali_semFundo.png" alt="">
        <p>&copy;Thiago Fernandes</p>
        <p>&copy;Anne Izabelle</p>
    </footer>

</body>
